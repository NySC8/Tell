<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Tell</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
#app{width:100%;height:100%}
.stage{width:100%;height:100%;min-height:100dvh;display:grid;place-items:center;padding:0;background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.035),transparent 55%),#050505;animation:in .8s cubic-bezier(.2,.7,.2,1) both}
.player{position:relative;width:min(1180px,100%);aspect-ratio:16/9;overflow:hidden;background:#000;box-shadow:0 28px 100px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05)}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000;cursor:pointer}
.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.72),transparent 38%);opacity:0;transition:opacity .25s}
.controls-visible .vignette{opacity:1}
.controls{position:absolute;left:18px;right:18px;bottom:15px;opacity:0;transform:translateY(8px);transition:.24s;z-index:4}
.controls-visible .controls{opacity:1;transform:none}
.timeline{appearance:none;width:100%;height:3px;margin:0 0 10px;display:block;cursor:pointer;background:rgba(255,255,255,.28);border-radius:10px}
.timeline::-webkit-slider-thumb{appearance:none;width:11px;height:11px;border-radius:50%;background:#fff}
.timeline::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:#fff}
.row{display:flex;align-items:center;justify-content:space-between}
.left{display:flex;align-items:center;gap:4px}
button{border:0;background:transparent;color:#fff;width:38px;height:34px;display:grid;place-items:center;border-radius:8px;cursor:pointer;transition:.18s}
button:hover{background:rgba(255,255,255,.11)}
button:active{transform:scale(.94)}
svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8}
#play svg{fill:currentColor}
.time{margin-left:6px;color:rgba(255,255,255,.72);font-size:12px;font-variant-numeric:tabular-nums}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.38);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);opacity:0;z-index:3;transition:.24s}
.controls-visible .center{opacity:1}
.center:hover{transform:translate(-50%,-50%) scale(1.05);background:rgba(255,255,255,.12)}
@keyframes in{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
@media(max-width:700px){
 .player{width:100%;border-radius:0}
 .controls{left:9px;right:9px;bottom:8px}
 .center{width:52px;height:52px}
 button{width:34px}
 .time{font-size:11px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DEMO_VIDEO="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4";

const icons={
 play:'<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>',
 pause:'<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>',
 back:'<svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M4 12h13a4 4 0 014 4v1"/></svg>',
 forward:'<svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5M20 12H7a4 4 0 00-4 4v1"/></svg>',
 volume:'<svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M16 9a5 5 0 010 6M18.5 6.5a9 9 0 010 11"/></svg>',
 mute:'<svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4z"/><path d="M18 9l4 6M22 9l-4 6"/></svg>',
 full:'<svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M21 16v5h-5"/></svg>'
};

document.getElementById("app").innerHTML=`
<main class="stage">
 <div class="player" id="player">
  <video id="video" src="${DEMO_VIDEO}" playsinline preload="metadata"></video>
  <div class="vignette"></div>
  <button class="center" id="center" aria-label="Play">${icons.play}</button>
  <div class="controls" id="controls">
   <input id="timeline" class="timeline" type="range" min="0" max="0" step=".1" value="0" aria-label="Timeline">
   <div class="row">
    <div class="left">
     <button id="play">${icons.play}</button>
     <button id="back">${icons.back}</button>
     <button id="forward">${icons.forward}</button>
     <button id="mute">${icons.volume}</button>
     <span class="time" id="time">0:00 / 0:00</span>
    </div>
    <button id="full">${icons.full}</button>
   </div>
  </div>
 </div>
</main>`;

const v=document.getElementById("video"), player=document.getElementById("player");
const controls=document.getElementById("controls"), center=document.getElementById("center");
const play=document.getElementById("play"), timeline=document.getElementById("timeline");
const mute=document.getElementById("mute"), time=document.getElementById("time");
let timer;

function showControls(){
 player.classList.add("controls-visible");
 clearTimeout(timer);
 timer=setTimeout(()=>{if(!v.paused)player.classList.remove("controls-visible")},2200);
}
function fmt(s){
 if(!Number.isFinite(s))return "0:00";
 return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
}
function toggle(){
 if(v.paused)v.play();else v.pause();
 showControls();
}
function sync(){
 play.innerHTML=v.paused?icons.play:icons.pause;
 center.innerHTML=v.paused?icons.play:icons.pause;
 timeline.value=v.currentTime||0;
 time.textContent=fmt(v.currentTime)+" / "+fmt(v.duration);
}
play.onclick=toggle; center.onclick=toggle; v.onclick=toggle;
document.getElementById("back").onclick=()=>{v.currentTime=Math.max(0,v.currentTime-10);showControls()};
document.getElementById("forward").onclick=()=>{v.currentTime=Math.min(v.duration||0,v.currentTime+10);showControls()};
mute.onclick=()=>{v.muted=!v.muted;mute.innerHTML=v.muted?icons.mute:icons.volume;showControls()};
timeline.oninput=()=>{v.currentTime=Number(timeline.value);showControls()};
document.getElementById("full").onclick=async()=>{
 if(document.fullscreenElement)await document.exitFullscreen();else await player.requestFullscreen?.();
 showControls();
};
v.addEventListener("loadedmetadata",()=>{timeline.max=v.duration||0;sync()});
v.addEventListener("timeupdate",sync);
v.addEventListener("play",sync);
v.addEventListener("pause",()=>{sync();showControls()});
player.addEventListener("mousemove",showControls);
player.addEventListener("touchstart",showControls,{passive:true});
document.addEventListener("keydown",e=>{
 if(e.code==="Space"){e.preventDefault();toggle()}
 if(e.code==="ArrowLeft"){v.currentTime=Math.max(0,v.currentTime-10);showControls()}
 if(e.code==="ArrowRight"){v.currentTime=Math.min(v.duration||0,v.currentTime+10);showControls()}
});
showControls();
</script>
</body>
</html>
